name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      enable_ssh:
        description: "Enable SSH connection to Actions"
        required: true
        default: "false"

# GITHUB_TOKEN 默认是只读的，上传 Release、删除 Workflow 运行记录都需要显式授权
permissions:
  contents: write
  actions: write

# 同一时间只允许一个构建，避免并发构建互相抢占 Release tag
concurrency:
  group: openwrt-build
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    # ubuntu-22.04 目前仍可用，但已进入淘汰序列；包列表已兼容 24.04，
    # 未来切换到 24.04 只需改这一行（若报镜像不存在，直接改 ubuntu-24.04 即可）
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker images -q | xargs -r docker rmi || true
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* snap*
          sudo -E apt -y full-upgrade
          # libncurses5-dev / libncursesw5-dev 在 22.04 只是过渡包、24.04 已移除；
          # libncurses-dev 在 22.04/24.04 均可用，效果相同
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Clone source code
        run: |
          df -hT $PWD
          # 构建不需要完整 git 历史，浅克隆能明显缩短时间
          git clone $REPO_URL -b $REPO_BRANCH --depth=1 openwrt

      - name: Update feeds
        run: |
          cd openwrt
          # 添加自定义 feeds 库（改下面的链接）
          # 注意：feed 名只能由字母/数字/下划线组成，不能含连字符 "-"，
          # 否则 scripts/feeds 解析会报 "Syntax error in feeds.conf.default"（例如 openwrt-clashoo 不行）
          # 另外 lede master 已自带 helloworld feed，重复添加会报 "Duplicate feed name"
          # 注释掉lede的helloworld 改用small的代理插件库
          sed -i 's/^src-git helloworld/# src-git helloworld/g' feeds.conf.default
          echo 'src-git small https://github.com/kenzok8/small.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            echo "检测到配置文件 $CONFIG_FILE，复制到 openwrt/.config"
            cp "$CONFIG_FILE" openwrt/.config
            cd openwrt
            # 用默认值补全 .config 缺失的配置项，避免编译时卡在交互式配置提示
            make defconfig
          else
            echo "警告: $CONFIG_FILE 文件不存在，跳过复制步骤"
          fi

      - name: SSH connection to Actions
        uses: mxschmitt/action-tmate@v3
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_ssh == 'true'
        # SSH 只是调试辅助：连不上 tmate.io 时不要拖垮整个构建
        continue-on-error: true
        timeout-minutes: 20
        with:
          # 公开仓库下限制只有触发者本人（需在 GitHub 注册过 SSH 公钥）能连接，
          # 否则任何人都可能从日志拿到地址 SSH 进 runner
          limit-access-to-actor: true

      - name: Cache OpenWrt downloads
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ hashFiles('openwrt/feeds.conf.default') }}-${{ hashFiles('.config') }}
          restore-keys: |
            dl-${{ runner.os }}-

      - name: Download package
        run: |
          cd openwrt
          # 网络不稳定时自动重试 3 次
          for i in 1 2 3; do
            if make download -j8; then
              break
            fi
            echo "第 $i 次 make download 失败，重试..."
            [ "$i" -lt 3 ] || exit 1
          done
          # 删除下载失败产生的 <1KB 空文件
          find dl -size -1024c -delete

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          # Go 模块缓存 (dl/go-mod-cache) 在并发/中断时容易损坏，
          # 表现为 "no required module provides package" / "missing go.sum entry" /
          # "build constraints exclude all Go files"，所以每次编译前清掉，保证从完整缓存开始
          rm -rf dl/go-mod-cache
          if make -j$(nproc); then
            echo "编译成功"
          else
            echo "多线程编译失败，清理 Go 模块缓存后单线程重试"
            rm -rf dl/go-mod-cache
            make -j1 V=s || exit 1
          fi
          # status 要放在 if/else 之外：单线程回退编译成功时也必须输出，
          # 否则后续上传步骤会因 outputs.status 为空而被跳过
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then
            # 配置多个设备时用下划线拼接，避免工件名里出现换行
            echo "DEVICE_NAME=_$(paste -sd_ DEVICE_NAME)" >> $GITHUB_ENV
          else
            echo "DEVICE_NAME=_unknown" >> $GITHUB_ENV
          fi
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      - name: Upload bin directory
        uses: actions/upload-artifact@v7
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          # 配置了多个 target 时通配符会匹配多个目录导致 cd 报错，这里只取第一个
          TARGET_DIR=$(ls -d openwrt/bin/targets/*/* 2>/dev/null | head -n1 || true)
          if [ -z "$TARGET_DIR" ]; then
            echo "未找到编译产物目录 openwrt/bin/targets/*/*"
            exit 1
          fi
          cd "$TARGET_DIR"
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          # 精确到秒，降低同分钟重复构建时 tag 冲突导致上传失败的概率
          echo "release_tag=$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          {
            echo "OpenWrt 编译完成！"
            echo "- 设备: ${{ env.DEVICE_NAME }}"
            echo "- 编译时间: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          } > release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        # 已维护，固定到大版本 v2（原 @main 指向不固定分支）
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2
          # 只清理本工作流的运行记录，不误删仓库里其他工作流
          delete_workflow_pattern: OpenWrt Builder

      - name: Remove old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 原 dev-drprasad/delete-older-releases 仓库已归档停维护，改用 runner 预装的 gh CLI
          # 保留最新 3 个 Release，删除更早的 Release 及其关联 tag
          gh release list --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[3:][] | .tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true
