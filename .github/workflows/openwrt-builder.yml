name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      enable_ssh:
        description: "Enable SSH connection to Actions runner(Debug)"
        required: true
        default: "false"
env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  # 缓存开关
  ENABLE_CCACHE: true
  ENABLE_DL_CACHE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          df -h
          free -h
          timedatectl set-timezone "Asia/Shanghai"

      - name: Cleanup runner space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker images -q | xargs -r docker rmi
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo apt-mark hold grub-efi-amd64-signed
          sudo apt update
          sudo apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* snap*
          sudo apt -y full-upgrade
          sudo apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo apt -y autoremove --purge
          sudo apt clean

      - name: Cache dl download files
        uses: actions/cache@v4
        if: env.ENABLE_DL_CACHE == 'true'
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: Cache ccache compile cache
        uses: actions/cache@v4
        if: env.ENABLE_CCACHE == 'true'
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('**/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-ccache-

      - name: Clone OpenWrt source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      - name: Update & Install feeds
        run: |
          cd openwrt
          # ==== 自定义feeds源区域 ====
          # echo 'src-git helloworld https://github.com/fw876/helloworld' >> feeds.conf.default
          echo 'src-git openwrt-clashoo https://github.com/kenzok8/openwrt-clashoo.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom .config
        run: |
          if [ -f "${{ env.CONFIG_FILE }}" ]; then
            echo "✅ Found custom .config , copy to openwrt/.config"
            cp "${{ env.CONFIG_FILE }}" openwrt/.config
          else
            echo "⚠️ No custom .config file found, will use default config"
          fi
          cd openwrt
          make defconfig

      - name: SSH debug connect
        uses: mxschmitt/action-tmate@v3
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_ssh == 'true'

      - name: Download source files
        id: download
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          if [ "${{ env.ENABLE_CCACHE }}" = "true" ]; then
            export CCACHE_DIR=~/.ccache
            export PATH="/usr/lib/ccache:$PATH"
            ccache -z
          fi
          CPU_CORE=$(nproc)
          echo "🧵 Use ${CPU_CORE} threads compile"
          set +e
          make -j${CPU_CORE}
          COMPILE_RET=$?
          set -e
          if [ ${COMPILE_RET} -ne 0 ]; then
            echo "⚠️ Parallel compile failed, switch to single thread verbose mode"
            make -j1 V=s
          fi
          if [ "${{ env.ENABLE_CCACHE }}" = "true" ]; then
            ccache -s
          fi
          # parse target device name
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > ./DEVICE_NAME
          if [ -s ./DEVICE_NAME ]; then
            TARGET_DEV=$(cat ./DEVICE_NAME)
          else
            TARGET_DEV="unknown"
          fi
          BUILD_DATE=$(date +"%Y%m%d%H%M")
          echo "DEVICE_NAME=${TARGET_DEV}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload full bin artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.BUILD_DATE }}
          path: openwrt/bin

      - name: Prepare firmware files
        id: prepare_firmware
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.prepare_firmware.outputs.status == 'success'
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE_DIR }}

      - name: Prepare release meta
        id: release_meta
        if: env.UPLOAD_RELEASE == 'true' && steps.prepare_firmware.outputs.status == 'success'
        run: |
          RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          cat > release_body.md << EOF
## OpenWrt Build $RELEASE_TAG
- Device: **${{ env.DEVICE_NAME }}**
- Build Time: $(date "+%Y‑%m‑%d %H:%M:%S")
- Source: ${{ env.REPO_URL }} @ ${{ env.REPO_BRANCH }}
EOF
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        if: steps.release_meta.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          body_path: release_body.md
          files: ${{ env.FIRMWARE_DIR }}/*
          prerelease: false

      # ========== 废弃旧action删除运行记录（原脚本的两个action全部有坑） ==========
      # 原 delete-workflow-runs retain_days:0 会直接删除当前正在跑的workflow，导致构建直接中断！
      # delete‑older‑releases 仓库已经归档不再维护，建议手动或者写shell脚本控制旧release清理，不建议自动删release

